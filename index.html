<!DOCTYPE html>
<html lang="it">
<head>
<!--
  Poster Generator — Casa Balla
  Serve via HTTP: npx serve .  (or python -m http.server 8000)
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generatore Poster — Casa Balla</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-full.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f0f0f0; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; height: 100vh; }
  #toolbar {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.95); border-radius: 12px;
    padding: 16px 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    display: flex; gap: 16px; align-items: center; z-index: 10;
    backdrop-filter: blur(8px);
  }
  #toolbar label { font-size: 14px; font-weight: 600; color: #333; }
  #toolbar input[type="number"] {
    width: 60px; padding: 6px 8px; border: 2px solid #ddd; border-radius: 6px;
    font-size: 14px; text-align: center;
  }
  #toolbar input[type="number"]:focus { border-color: #009fe3; outline: none; }
  #generateBtn {
    background: #009fe3; color: #fff; border: none; border-radius: 6px;
    padding: 8px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background 0.2s;
  }
  #generateBtn:hover { background: #007bb5; }
  #exportBtn {
    background: #733b8f; color: #fff; border: none; border-radius: 6px;
    padding: 8px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background 0.2s;
  }
  #exportBtn:hover { background: #5a2e72; }
  #errorMsg {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: #e74c3c; color: #fff; padding: 12px 24px; border-radius: 8px;
    display: none; z-index: 10; font-size: 14px;
  }
  #canvasContainer {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  }
  canvas { display: block; }
</style>
</head>
<body>
  <div id="toolbar">
    <label for="colsInput">Colonne</label>
    <input type="number" id="colsInput" value="6" min="3" max="20">
    <label for="rowsInput">Righe</label>
    <input type="number" id="rowsInput" value="8" min="3" max="20">
    <button id="generateBtn">Genera</button>
    <button id="exportBtn">Esporta PNG</button>
  </div>
  <div id="errorMsg" role="alert"></div>
  <div id="canvasContainer">
    <canvas id="myCanvas"></canvas>
  </div>
  <script>
    const TILES = [
      'tasselli/Risorsa 8.svg', 'tasselli/Risorsa 9.svg', 'tasselli/Risorsa 10.svg',
      'tasselli/Risorsa 11.svg', 'tasselli/Risorsa 12.svg', 'tasselli/Risorsa 13.svg',
      'tasselli/Risorsa 14.svg', 'tasselli/Risorsa 15.svg', 'tasselli/Risorsa 16.svg',
      'tasselli/Risorsa 17.svg', 'tasselli/Risorsa 18.svg', 'tasselli/Risorsa 19.svg',
      'tasselli/Risorsa 20.svg', 'tasselli/Risorsa 21.svg', 'tasselli/Risorsa 22.svg',
      'tasselli/Risorsa 23.svg', 'tasselli/Risorsa 24.svg', 'tasselli/Risorsa 25.svg',
      'tasselli/Risorsa 26.svg', 'tasselli/Risorsa 27.svg', 'tasselli/Risorsa 28.svg',
      'tasselli/Risorsa 29.svg'
    ];

    const SPECIALS = [
      { file: 'speciali/titolo-2x3.svg',  w: 2, h: 3 },
      { file: 'speciali/info-2x2.svg',    w: 2, h: 2 },
      { file: 'speciali/contatti-2x1.svg', w: 2, h: 1 },
      { file: 'speciali/maxxi-1x1.svg',   w: 1, h: 1 },
      { file: 'speciali/sovrintendenza-1x1.svg', w: 1, h: 1 }
    ];

    const CELL_PAD = 60;

    function calcCellSize(cols, rows) {
      const container = document.getElementById('canvasContainer');
      const availW = container.clientWidth - CELL_PAD * 2;
      const availH = container.clientHeight - CELL_PAD * 2;
      if (availW <= 0 || availH <= 0) return 168.38;
      return Math.floor(Math.min(availW / cols, availH / rows));
    }

    let tileSymbols = [];
    let specialSymbols = [];
    let swapTimer = null;
    let isAnimating = false;
    let animatingTiles = [];
    let prevSpecials = [];
    let prevTiles = [];
    let currentSpecials = [];
    let currentTiles = [];
    let currentCs = 0;

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 5000);
    }

    async function loadSVG(url) {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`Failed to load: ${url}`);
      const svgText = await resp.text();
      const svg = document.createElement('svg');
      svg.innerHTML = svgText;
      const item = paper.project.importSVG(svg);
      if (!item) throw new Error(`Failed to parse SVG: ${url}`);
      return item;
    }

    async function loadAllSVGs() {
      const tilePromises = TILES.map(url =>
        loadSVG(url).catch(() => null)
      );
      const specialPromises = SPECIALS.map(s =>
        loadSVG(s.file).catch(() => null)
      );
      const tiles = (await Promise.all(tilePromises)).filter(Boolean);
      const specials = (await Promise.all(specialPromises)).filter(Boolean);
      if (tiles.length === 0) throw new Error('Nessun tassello caricato. Verifica i file SVG.');
      tileSymbols = tiles.map(t => new paper.Symbol(t));
      specialSymbols = specials.map((s, i) => ({
        symbol: new paper.Symbol(s),
        w: SPECIALS[i].w,
        h: SPECIALS[i].h
      }));
    }

    let grid = [];
    let gridCols = 0;
    let gridRows = 0;

    function initGrid(cols, rows) {
      gridCols = cols;
      gridRows = rows;
      grid = Array.from({ length: rows }, () => Array(cols).fill(null));
    }

    function canPlace(r, c, w, h) {
      if (r + h > gridRows || c + w > gridCols) return false;
      for (let dr = 0; dr < h; dr++)
        for (let dc = 0; dc < w; dc++)
          if (grid[r + dr][c + dc] !== null) return false;
      return true;
    }

    function placeSpecial(r, c, idx) {
      const special = SPECIALS[idx];
      for (let dr = 0; dr < special.h; dr++)
        for (let dc = 0; dc < special.w; dc++)
          grid[r + dr][c + dc] = { type: 'special', index: idx };
      return { row: r, col: c, w: special.w, h: special.h, special: true, index: idx };
    }

    function placeSpecials() {
      const placed = [];
      const indexed = SPECIALS.map((s, i) => ({ ...s, origIndex: i }));
      const order = [...indexed].sort((a, b) => (b.w * b.h) - (a.w * a.h));

      for (const special of order) {
        if (special.h > gridRows || special.w > gridCols) {
          throw new Error('Griglia troppo piccola per gli speciali. Aumenta righe o colonne.');
        }

        let attempts = 0;
        let success = false;

        while (attempts < 100 && !success) {
          const r = Math.floor(Math.random() * (gridRows - special.h + 1));
          const c = Math.floor(Math.random() * (gridCols - special.w + 1));
          if (canPlace(r, c, special.w, special.h)) {
            placed.push(placeSpecial(r, c, special.origIndex));
            success = true;
          }
          attempts++;
        }

        if (!success) {
          for (let r = 0; r <= gridRows - special.h; r++) {
            for (let c = 0; c <= gridCols - special.w; c++) {
              if (canPlace(r, c, special.w, special.h)) {
                placed.push(placeSpecial(r, c, special.origIndex));
                success = true;
                break;
              }
            }
            if (success) break;
          }
        }

        if (!success) {
          throw new Error('Griglia troppo piccola per posizionare tutti gli speciali. Aumenta righe o colonne.');
        }
      }
      return placed;
    }

    let tilePool = [];

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function refillPool() {
      tilePool = shuffleArray([...Array(tileSymbols.length).keys()]);
    }

    function nextTileIndex() {
      if (tilePool.length === 0) refillPool();
      return tilePool.pop();
    }

    function placeTiles() {
      refillPool();
      const placed = [];
      for (let r = 0; r < gridRows; r++) {
        for (let c = 0; c < gridCols; c++) {
          if (grid[r][c] !== null) continue;
          const sizes = shuffleArray([3, 2, 1]);
          for (const size of sizes) {
            if (canPlace(r, c, size, size)) {
              const idx = nextTileIndex();
              for (let dr = 0; dr < size; dr++)
                for (let dc = 0; dc < size; dc++)
                  grid[r + dr][c + dc] = { type: 'tile', index: idx, size: size };
              placed.push({ row: r, col: c, size, tileIndex: idx });
              break;
            }
          }
        }
      }
      return placed;
    }

    paper.setup('myCanvas');

    paper.view.onFrame = function(event) {
      if (!isAnimating || animatingTiles.length === 0) return;
      const duration = 1.5;
      const t = Math.min(event.time / duration, 1);

      for (const a of animatingTiles) {
        a.item.matrix = a.baseMatrix.clone();
        const pt = a.oldPos.clone().add(a.newPos.subtract(a.oldPos).multiply(t));
        a.item.position = pt;

        const smear = 1 + Math.sin(t * Math.PI) * 2.5;
        const center = a.item.bounds.center;
        a.item.rotate(-a.angle, center);
        a.item.scale(smear, 1 / Math.sqrt(smear), center);
        a.item.rotate(a.angle, center);
      }

      if (t >= 1) {
        isAnimating = false;
        animatingTiles = [];
        renderPoster(currentSpecials, currentTiles, currentCs);
      }
    };

    function placeAndFill(inst, cellX, cellY, cellW, cellH) {
      inst.position = new paper.Point(cellX + cellW / 2, cellY + cellH / 2);
      const b = inst.bounds;
      if (b.width > 0 && b.height > 0) {
        const s = Math.max(cellW / b.width, cellH / b.height);
        inst.scale(s);
        inst.position = new paper.Point(cellX + cellW / 2, cellY + cellH / 2);
      }
    }

    function renderPoster(placedSpecials, placedTiles, cs) {
      paper.project.activeLayer.removeChildren();
      const totalW = gridCols * cs;
      const totalH = gridRows * cs;

      const bg = new paper.Shape.Rectangle({
        point: [0, 0],
        size: [totalW, totalH],
        fillColor: '#ffffff'
      });

      for (const s of placedSpecials) {
        const inst = specialSymbols[s.index].symbol.place([0, 0]);
        placeAndFill(inst, s.col * cs, s.row * cs, s.w * cs, s.h * cs);
        s._item = inst;
      }

      for (const t of placedTiles) {
        const inst = tileSymbols[t.tileIndex].place([0, 0]);
        placeAndFill(inst, t.col * cs, t.row * cs, t.size * cs, t.size * cs);
        t._item = inst;
      }

      paper.view.zoom = 1;
      paper.view.center = new paper.Point(totalW / 2, totalH / 2);
      paper.view.draw();
    }

    let svgsLoaded = false;
    let generating = false;

    function startSwapTimer() {
      if (swapTimer) clearInterval(swapTimer);
      swapTimer = setInterval(() => {
        if (isAnimating || generating) return;
        triggerSwap();
      }, 5000);
    }

    function stepTiles() {
      const entries = [];
      const visited = new Set();

      for (let r = 0; r < gridRows; r++) {
        for (let c = 0; c < gridCols; c++) {
          const key = r + ',' + c;
          if (visited.has(key)) continue;
          const cell = grid[r][c];
          if (cell === null) continue;

          if (cell.type === 'special') {
            const sp = SPECIALS[cell.index];
            entries.push({ type: 'special', index: cell.index, row: r, col: c, w: sp.w, h: sp.h });
            for (let dr = 0; dr < sp.h; dr++)
              for (let dc = 0; dc < sp.w; dc++)
                visited.add((r + dr) + ',' + (c + dc));
          } else {
            const sz = cell.size;
            entries.push({ type: 'tile', index: cell.index, row: r, col: c, w: sz, h: sz });
            for (let dr = 0; dr < sz; dr++)
              for (let dc = 0; dc < sz; dc++)
                visited.add((r + dr) + ',' + (c + dc));
          }
        }
      }

      shuffleArray(entries);

      for (const e of entries) {
        const dirs = shuffleArray([{ dr: -1, dc: 0 }, { dr: 1, dc: 0 }, { dr: 0, dc: -1 }, { dr: 0, dc: 1 }]);
        for (const dir of dirs) {
          const nr = e.row + dir.dr;
          const nc = e.col + dir.dc;
          if (nr < 0 || nr + e.h > gridRows || nc < 0 || nc + e.w > gridCols) continue;

          if (e.w === 1 && e.h === 1) {
            const occ = grid[nr][nc];
            if (occ !== null) {
              const isSwapSpecial = occ.type === 'special';
              const isSwapTile = occ.type === 'tile' && occ.size === 1;
              if (!isSwapSpecial && !isSwapTile) continue;
              const occIdx = entries.findIndex(x => x.type === occ.type && x.index === occ.index);
              if (occIdx < 0) continue;
              const other = entries[occIdx];
              const cellE = e.type === 'special' ? { type: 'special', index: e.index } : { type: 'tile', index: e.index, size: 1 };
              const cellO = other.type === 'special' ? { type: 'special', index: other.index } : { type: 'tile', index: other.index, size: 1 };
              grid[e.row][e.col] = null;
              grid[other.row][other.col] = null;
              grid[nr][nc] = cellE;
              grid[e.row][e.col] = cellO;
              const tmpR = other.row, tmpC = other.col;
              other.row = e.row; other.col = e.col;
              e.row = nr; e.col = nc;
              break;
            }
          } else {
            let free = true;
            for (let dr = 0; dr < e.h && free; dr++)
              for (let dc = 0; dc < e.w && free; dc++) {
                const occ = grid[nr + dr][nc + dc];
                if (occ !== null && !(occ.type === e.type && occ.index === e.index))
                  free = false;
              }
            if (free) {
              for (let dr = 0; dr < e.h; dr++)
                for (let dc = 0; dc < e.w; dc++)
                  grid[e.row + dr][e.col + dc] = null;
              for (let dr = 0; dr < e.h; dr++)
                for (let dc = 0; dc < e.w; dc++) {
                  if (e.type === 'special')
                    grid[nr + dr][nc + dc] = { type: 'special', index: e.index };
                  else
                    grid[nr + dr][nc + dc] = { type: 'tile', index: e.index, size: e.w };
                }
              e.row = nr;
              e.col = nc;
              break;
            }
          }
        }
      }

      const resultSpecials = [];
      const resultTiles = [];
      const mark = new Set();

      for (let r = 0; r < gridRows; r++) {
        for (let c = 0; c < gridCols; c++) {
          const key = r + ',' + c;
          if (mark.has(key)) continue;
          const cell = grid[r][c];
          if (cell === null) continue;

          if (cell.type === 'special') {
            const sp = SPECIALS[cell.index];
            resultSpecials.push({ row: r, col: c, w: sp.w, h: sp.h, special: true, index: cell.index });
            for (let dr = 0; dr < sp.h; dr++)
              for (let dc = 0; dc < sp.w; dc++)
                mark.add((r + dr) + ',' + (c + dc));
          } else {
            resultTiles.push({ row: r, col: c, size: cell.size, tileIndex: cell.index });
            for (let dr = 0; dr < cell.size; dr++)
              for (let dc = 0; dc < cell.size; dc++)
                mark.add((r + dr) + ',' + (c + dc));
          }
        }
      }

      return { specials: resultSpecials, tiles: resultTiles };
    }

    async function triggerSwap() {
      isAnimating = true;
      try {
        const cs = currentCs;
        prevSpecials = currentSpecials;
        prevTiles = currentTiles;

        const { specials, tiles } = stepTiles();
        const gapFillers = placeTiles();
        const allTiles = tiles.concat(gapFillers);
        renderPoster(specials, allTiles, cs);

        const animItems = [];
        for (const ns of specials) {
          const os = prevSpecials.find(s => s.index === ns.index);
          if (!os) continue;
          const item = ns._item;
          const oldPos = new paper.Point((os.col + os.w / 2) * cs, (os.row + os.h / 2) * cs);
          const newPos = new paper.Point((ns.col + ns.w / 2) * cs, (ns.row + ns.h / 2) * cs);
          if (oldPos.getDistance(newPos) < 1) continue;
          item.position = oldPos;
          animItems.push({
            item,
            oldPos: oldPos.clone(),
            newPos: newPos.clone(),
            baseMatrix: item.matrix.clone(),
            angle: newPos.subtract(oldPos).angle
          });
        }

        for (const nt of tiles) {
          const ot = prevTiles.find(t => t.tileIndex === nt.tileIndex);
          if (!ot) continue;
          const item = nt._item;
          const oldPos = new paper.Point((ot.col + ot.size / 2) * cs, (ot.row + ot.size / 2) * cs);
          const newPos = new paper.Point((nt.col + nt.size / 2) * cs, (nt.row + nt.size / 2) * cs);
          if (oldPos.getDistance(newPos) < 1) continue;
          item.position = oldPos;
          animItems.push({
            item,
            oldPos: oldPos.clone(),
            newPos: newPos.clone(),
            baseMatrix: item.matrix.clone(),
            angle: newPos.subtract(oldPos).angle
          });
        }

        currentSpecials = specials;
        currentTiles = allTiles;
        animatingTiles = animItems;
      } catch (e) {
        showError(e.message);
        isAnimating = false;
      }
    }

    async function init() {
      if (generating) return;
      generating = true;
      try {
        if (!svgsLoaded) {
          await loadAllSVGs();
          svgsLoaded = true;
        }
        resizeCanvas();
        const cols = parseInt(document.getElementById('colsInput').value);
        const rows = parseInt(document.getElementById('rowsInput').value);
        const cs = calcCellSize(cols, rows);
        initGrid(cols, rows);
        const specials = placeSpecials();
        const tiles = placeTiles();
        renderPoster(specials, tiles, cs);
        currentSpecials = specials;
        currentTiles = tiles;
        currentCs = cs;
        startSwapTimer();
      } catch (e) {
        showError(e.message);
      } finally {
        generating = false;
      }
    }

    function resizeCanvas() {
      const container = document.getElementById('canvasContainer');
      const canvas = document.getElementById('myCanvas');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      paper.view.viewSize = new paper.Size(canvas.width, canvas.height);
    }

    window.addEventListener('resize', () => {
      resizeCanvas();
      if (gridCols > 0 && !isAnimating) init();
    });

    resizeCanvas();
    init();

    document.getElementById('generateBtn').addEventListener('click', () => {
      if (swapTimer) clearInterval(swapTimer);
      swapTimer = null;
      isAnimating = false;
      animatingTiles = [];
      init();
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
      const canvas = document.getElementById('myCanvas');
      const link = document.createElement('a');
      link.download = 'poster-casa-balla.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
